name: CD - deploy signin

on:
  push:
    branches: [preview, ci/setup-deploy]
  workflow_dispatch:

concurrency:
  group: cd-signin-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: [self-hosted, drumee-liam]
    timeout-minutes: 15
    outputs:
      endpoint: ${{ steps.ep.outputs.endpoint }}
      verify_url: ${{ steps.ep.outputs.verify_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve endpoint
        id: ep
        run: |
          if [ "${{ github.ref_name }}" = "ci/setup-deploy" ]; then
            EP="liam"
          else
            EP="main"
          fi
          echo "endpoint=$EP" >> $GITHUB_OUTPUT
          if [ "$EP" = "main" ]; then
            echo "verify_url=https://drumee.in/-/plugins/signin/index.json" >> $GITHUB_OUTPUT
          else
            echo "verify_url=https://drumee.in/-/$EP/plugins/signin/index.json" >> $GITHUB_OUTPUT
          fi

      - name: Show env
        run: |
          echo "Endpoint: ${{ steps.ep.outputs.endpoint }}"
          echo "Verify URL: ${{ steps.ep.outputs.verify_url }}"
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup deploy env
        run: |
          npm run setup -- --output=deploy \
            --endpoint=${{ steps.ep.outputs.endpoint }} \
            --user=${{ steps.ep.outputs.endpoint }} \
            --build-mode=production
          sed -i "s|UI_BUILD_PATH=.*|UI_BUILD_PATH=/tmp/drumee-build/${{ steps.ep.outputs.endpoint }}/plugins/signin|" .dev-tools.rc/deploy.sh

      - name: Webpack build
        run: npm run deploy

  deploy:
    name: Deploy
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      EP: ${{ needs.build.outputs.endpoint }}
      RUNTIME_DIR: /srv/drumee/runtime/plugins/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backup current state
        run: sudo rsync -a --delete $RUNTIME_DIR/$EP/signin/ $RUNTIME_DIR/$EP/signin.backup/

      - name: Sync to runtime dir
        run: sudo rsync -a --delete /tmp/drumee-build/$EP/plugins/signin/signin/ $RUNTIME_DIR/$EP/signin/

      - name: Restart endpoint
        run: |
          sudo /usr/sbin/drumee restart $EP > /dev/null
          sudo /usr/sbin/drumee restart $EP/service > /dev/null
          echo "Restarted endpoint"

      - name: Verify deployed commit matches
        run: |
          sleep 5
          deployed=$(curl -sk ${{ needs.build.outputs.verify_url }} \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['head'])")
          local=$(git log -1 --pretty=format:'%h')
          echo "deployed head: $deployed"
          echo "local    head: $local"
          [ "$deployed" = "$local" ] && exit 0 || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to previous version..."
          sudo rsync -a --delete $RUNTIME_DIR/$EP/signin.backup/ $RUNTIME_DIR/$EP/signin/
          sudo /usr/sbin/drumee restart $EP > /dev/null
          sudo /usr/sbin/drumee restart $EP/service > /dev/null
          echo "Rolled back"

      - name: Cleanup
        if: always()
        continue-on-error: true
        run: |
          sudo rm -rf $RUNTIME_DIR/$EP/signin.backup/
          rm -rf /tmp/drumee-build/$EP/plugins/signin/
