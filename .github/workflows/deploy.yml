name: CD - deploy signin

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: cd-signin-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      SGP_USER: debian
      SGP_HOST: sgp
      CONTAINER: drumee
      REPO: signin                 # checkout dir under /usr/src/drumee.test
      UI_NAME: signin              # name in runtime path + public URL
      DOMAIN: app.drumee.com
      EP: test
      BRANCH: test
      LOG_FILE: /tmp/cd-signin-${{ github.run_id }}.log
    steps:
      - name: Fetch and reset working tree
        id: fetch
        run: |
          OUTPUT=$(ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd /usr/src/drumee.test/$REPO
          PREV=\$(git rev-parse HEAD)
          echo "PREV=\$PREV"
          git fetch origin $BRANCH --quiet
          git checkout -f -B $BRANCH origin/$BRANCH --quiet
          NEW=\$(git rev-parse HEAD)
          echo "NEW=\$NEW"
          EOSSH
          )
          echo "$OUTPUT"
          PREV=$(echo "$OUTPUT" | grep '^PREV=' | cut -d= -f2)
          NEW=$(echo "$OUTPUT"  | grep '^NEW='  | cut -d= -f2)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"   >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:0:8}  New: ${NEW:0:8}"

      - name: Build and deploy
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd /usr/src/drumee.test/$REPO
          if ! npm install --no-audit --no-fund > $LOG_FILE 2>&1; then
            echo "::error::npm install failed. Tail:"; tail -50 $LOG_FILE; exit 1
          fi
          if ! NO_WATCH=yes npm run deploy >> $LOG_FILE 2>&1; then
            echo "::error::Build/deploy failed. Tail:"; tail -60 $LOG_FILE; exit 1
          fi
          echo "Built and deployed $UI_NAME to ui/$EP"
          EOSSH

      - name: Restart endpoint
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          /usr/sbin/drumee restart $EP         >> $LOG_FILE 2>&1
          /usr/sbin/drumee restart $EP/service >> $LOG_FILE 2>&1
          echo "Restarted $EP"
          sleep 3
          EOSSH

      - name: Verify (HTTP + head)
        env:
          EXPECTED: ${{ steps.fetch.outputs.new }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          sleep 3
          URL="https://localhost/-/$EP/plugins/$UI_NAME/index.json"
          CODE=\$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 -H "Host: $DOMAIN" "\$URL" || echo 000)
          echo "HTTP code: \$CODE"
          if [[ ! "\$CODE" =~ ^2[0-9][0-9]\$ ]]; then
            echo "::error::Verify failed: non-2xx (\$CODE) for $UI_NAME on $EP"; exit 1
          fi
          DEPLOYED=\$(curl -sk --max-time 10 -H "Host: $DOMAIN" "\$URL" | python3 -c "import sys,json; print(json.load(sys.stdin)['head'])" 2>/dev/null || echo "")
          EXPECTED_SHORT=\$(echo "$EXPECTED" | cut -c1-7)
          echo "Deployed head: \$DEPLOYED   Expected: \$EXPECTED_SHORT"
          if [ "\$DEPLOYED" != "\$EXPECTED_SHORT" ]; then
            echo "::error::Verify failed: deployed head mismatch"; exit 1
          fi
          echo "Verified $UI_NAME on $EP"
          EOSSH

      - name: Rollback (on failure)
        if: failure() && steps.fetch.outputs.prev != ''
        env:
          PREV: ${{ steps.fetch.outputs.prev }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -uo pipefail
          cd /usr/src/drumee.test/$REPO
          echo "::warning::Rolling back to ${PREV:0:8}"
          git reset --hard $PREV --quiet
          NO_WATCH=yes npm run deploy >> $LOG_FILE 2>&1 || true
          /usr/sbin/drumee restart $EP >> $LOG_FILE 2>&1 || true
          /usr/sbin/drumee restart $EP/service >> $LOG_FILE 2>&1 || true
          echo "Rolled back"
          EOSSH
