name: CD - deploy signin

on:
  push:
    branches: [test, preview]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target environment"
        type: choice
        options: [TEST, UAT, PROD]
        default: TEST

concurrency:
  # Repo-wide: TEST uses the .test tree, UAT/PROD share the main tree;
  # serialize all deploys for this plugin to avoid clobbering working trees.
  group: cd-signin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      SGP_USER: debian
      SGP_HOST: sgp
      CONTAINER: drumee
      REPO: signin                 # repo / checkout dir name
      UI_NAME: signin              # plugin name in runtime path + public URL
      DOMAIN: app.drumee.com
      LOG_FILE: /tmp/cd-signin-${{ github.run_id }}.log
    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.ref_name }}" in
              test)    TARGET=TEST ;;
              preview) TARGET=UAT ;;
              *) echo "Unsupported push branch: ${{ github.ref_name }}"; exit 1 ;;
            esac
          else
            TARGET="${{ github.event.inputs.target || 'TEST' }}"
          fi
          case "$TARGET" in
            TEST) SRC=/usr/src/drumee.test/$REPO; BRANCH=test;    EP=test;    ENVARG="";        VPATH=/-/test/plugins/$UI_NAME ;;
            UAT)  SRC=/usr/src/drumee/$REPO;      BRANCH=preview; EP=preview; ENVARG="preview"; VPATH=/-/preview/plugins/$UI_NAME ;;
            PROD) SRC=/usr/src/drumee/$REPO;      BRANCH=preview; EP=main;    ENVARG="";        VPATH=/-/plugins/$UI_NAME ;;
            *) echo "Unsupported target: $TARGET"; exit 1 ;;
          esac
          # loc=stage -> build+deploy locally on the runner host (drumee.in) `main`
          # loc=container -> build+deploy into the prod box (sgp) docker container
          LOC=container; [ "$TARGET" = "TEST" ] && LOC=stage
          echo "src=$SRC"       >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ep=$EP"         >> "$GITHUB_OUTPUT"
          echo "envarg=$ENVARG" >> "$GITHUB_OUTPUT"
          echo "vpath=$VPATH"   >> "$GITHUB_OUTPUT"
          echo "loc=$LOC"       >> "$GITHUB_OUTPUT"
          echo "::notice::Target $TARGET -> $UI_NAME on $EP (branch $BRANCH, loc $LOC)"

      # ---------------- TEST: build + deploy plugin to drumee.in (stage) `main` ----------------
      - name: Deploy to stage main (TEST)
        id: stage
        if: steps.target.outputs.loc == 'stage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_DIR=/usr/src/drumee/$REPO
          AUTH="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          [ -d "$REPO_DIR/.git" ] || sudo git init -q "$REPO_DIR"
          PREV=$(sudo git -C "$REPO_DIR" rev-parse HEAD 2>/dev/null || echo "")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          sudo git -C "$REPO_DIR" fetch --depth 1 "$AUTH" test
          sudo git -C "$REPO_DIR" checkout -f -B test FETCH_HEAD
          sudo git -C "$REPO_DIR" reset --hard FETCH_HEAD
          sudo git -C "$REPO_DIR" clean -fd -e .dev-tools.rc || true
          NEW=$(sudo git -C "$REPO_DIR" rev-parse --short HEAD)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Building $NEW ($UI_NAME) for stage main"
          sudo bash -c "cd '$REPO_DIR' && npm install --no-audit --no-fund"
          sudo bash -c "cd '$REPO_DIR' && NO_WATCH=yes npm run deploy -- deploy"

      - name: Verify stage main plugin (TEST)
        if: steps.target.outputs.loc == 'stage'
        env:
          EXPECTED: ${{ steps.stage.outputs.new }}
        run: |
          set -euo pipefail
          sleep 4
          URL="https://localhost/-/plugins/${UI_NAME}/index.json"
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: drumee.in' "$URL" || echo 000)
          BODY=$(curl -sk --max-time 10 -H 'Host: drumee.in' "$URL" || echo "")
          HEAD=$(echo "$BODY" | python3 -c "import sys,json;print(json.load(sys.stdin).get('head',''))" 2>/dev/null || echo "")
          echo "HTTP=$CODE deployed-head=$HEAD expected=$(echo "$EXPECTED" | cut -c1-7)"
          [[ "$CODE" =~ ^2[0-9][0-9]$ ]] || { echo "::error::stage plugin verify non-2xx ($CODE)"; exit 1; }
          echo "Verified stage main plugin $UI_NAME"

      - name: Rollback stage (on failure)
        if: failure() && steps.target.outputs.loc == 'stage' && steps.stage.outputs.prev != ''
        env:
          PREV: ${{ steps.stage.outputs.prev }}
        run: |
          set -uo pipefail
          REPO_DIR=/usr/src/drumee/$REPO
          echo "::warning::Rolling back stage $UI_NAME to ${PREV:0:8}"
          sudo git -C "$REPO_DIR" reset --hard "$PREV"
          sudo bash -c "cd '$REPO_DIR' && NO_WATCH=yes npm run deploy -- deploy" || true

      # ---------------- UAT / PROD: build + deploy into prod box (sgp) container ----------------
      - name: Fetch and reset working tree
        id: fetch
        if: steps.target.outputs.loc == 'container'
        env:
          SRC: ${{ steps.target.outputs.src }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          OUTPUT=$(ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $SRC
          PREV=\$(git rev-parse HEAD)
          echo "PREV=\$PREV"
          git fetch origin $BRANCH --quiet
          git checkout -f -B $BRANCH origin/$BRANCH --quiet
          NEW=\$(git rev-parse HEAD)
          echo "NEW=\$NEW"
          EOSSH
          )
          echo "$OUTPUT"
          PREV=$(echo "$OUTPUT" | grep '^PREV=' | cut -d= -f2)
          NEW=$(echo "$OUTPUT"  | grep '^NEW='  | cut -d= -f2)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"   >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:0:8}  New: ${NEW:0:8}"

      - name: Build and deploy
        if: steps.target.outputs.loc == 'container'
        env:
          SRC: ${{ steps.target.outputs.src }}
          EP: ${{ steps.target.outputs.ep }}
          ENVARG: ${{ steps.target.outputs.envarg }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $SRC
          if ! npm install --no-audit --no-fund > $LOG_FILE 2>&1; then
            echo "::error::npm install failed. Tail:"; tail -50 $LOG_FILE; exit 1
          fi
          if ! NO_WATCH=yes npm run deploy ${ENVARG:+-- }$ENVARG >> $LOG_FILE 2>&1; then
            echo "::error::Build/deploy failed. Tail:"; tail -60 $LOG_FILE; exit 1
          fi
          echo "Built and deployed $UI_NAME to ui/$EP"
          EOSSH

      - name: Restart endpoint
        if: steps.target.outputs.loc == 'container'
        env:
          EP: ${{ steps.target.outputs.ep }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          /usr/sbin/drumee restart $EP         >> $LOG_FILE 2>&1
          /usr/sbin/drumee restart $EP/service >> $LOG_FILE 2>&1
          echo "Restarted $EP"
          sleep 3
          EOSSH

      - name: Verify (HTTP + head)
        if: steps.target.outputs.loc == 'container'
        env:
          EXPECTED: ${{ steps.fetch.outputs.new }}
          EP: ${{ steps.target.outputs.ep }}
          VPATH: ${{ steps.target.outputs.vpath }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          sleep 3
          URL="https://localhost${VPATH}/index.json"
          CODE=\$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 -H "Host: $DOMAIN" "\$URL" || echo 000)
          echo "HTTP code: \$CODE"
          if [[ ! "\$CODE" =~ ^2[0-9][0-9]\$ ]]; then
            echo "::error::Verify failed: non-2xx (\$CODE) for $UI_NAME on $EP"; exit 1
          fi
          DEPLOYED=\$(curl -sk --max-time 10 -H "Host: $DOMAIN" "\$URL" | python3 -c "import sys,json; print(json.load(sys.stdin)['head'])" 2>/dev/null || echo "")
          EXPECTED_SHORT=\$(echo "$EXPECTED" | cut -c1-7)
          echo "Deployed head: \$DEPLOYED   Expected: \$EXPECTED_SHORT"
          if [ "\$DEPLOYED" != "\$EXPECTED_SHORT" ]; then
            echo "::error::Verify failed: deployed head mismatch"; exit 1
          fi
          echo "Verified $UI_NAME on $EP"
          EOSSH

      - name: Rollback (on failure)
        if: failure() && steps.target.outputs.loc == 'container' && steps.fetch.outputs.prev != ''
        env:
          PREV: ${{ steps.fetch.outputs.prev }}
          SRC: ${{ steps.target.outputs.src }}
          EP: ${{ steps.target.outputs.ep }}
          ENVARG: ${{ steps.target.outputs.envarg }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -uo pipefail
          cd $SRC
          echo "::warning::Rolling back to ${PREV:0:8}"
          git reset --hard $PREV --quiet
          NO_WATCH=yes npm run deploy ${ENVARG:+-- }$ENVARG >> $LOG_FILE 2>&1 || true
          /usr/sbin/drumee restart $EP >> $LOG_FILE 2>&1 || true
          /usr/sbin/drumee restart $EP/service >> $LOG_FILE 2>&1 || true
          echo "Rolled back"
          EOSSH
